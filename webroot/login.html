<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker — Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="center-view">
  <div class="auth-card">
    <h1>💰 Expense Tracker</h1>
    <p class="auth-subtitle">Let's get to know you first.</p>

    <label>Name</label>
    <input id="onbName" type="text" placeholder="e.g. raj123">

    <label>Full Name</label>
    <input id="onbFullName" type="text" placeholder="e.g. Raj Kumar">

    <label>Email</label>
    <input id="onbEmail" type="email" placeholder="e.g. raj@example.com">

    <button id="btnContinue" class="btn btn-primary btn-block">Continue</button>
    <p id="formError" class="form-error"></p>
  </div>
</section>

<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
